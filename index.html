<!DOCTYPE html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>八字健康疾病參考</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f3ee;color:#222;font-size:16px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:12px}h1{font-size:22px;margin:6px 0;color:#7a2a18}h2{font-size:18px;color:#7a2a18;border-bottom:1px solid #d8c9b5;padding-bottom:3px;margin:18px 0 8px}
.card{background:#fff;border:1px solid #e2d8ca;border-radius:8px;padding:12px;margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
select,input,button{font-size:16px;padding:6px;border:1px solid #bbb;border-radius:6px;background:#fff}
button{background:#7a2a18;color:#fff;border:0;padding:8px 14px}button.sec{background:#555}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pg div{text-align:center}.pg label{display:block;font-size:13px;color:#666}
.pg select{width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid #e0d6c8;padding:5px;vertical-align:top}th{background:#f3ece2}
.u{color:#999}.src{font-size:12px;color:#8a6d3b}.note{font-size:13px;color:#666}.warn{background:#fff4e5;border:1px solid #f0c27b;padding:8px;border-radius:6px;font-size:14px}
.big{font-size:22px;letter-spacing:4px;font-weight:bold}
table.sg td,table.sg2 td{text-align:center}.big2{font-size:20px;font-weight:bold}.bd{display:inline-block;border-radius:12px;padding:1px 8px;font-size:13px;white-space:nowrap}
td.sel,th.sel{outline:2px solid #1f3a52;outline-offset:-2px}.scr{overflow-x:auto;-webkit-overflow-scrolling:touch}table.ln td,table.ln th{white-space:nowrap;text-align:center;font-size:13px}table.lnv{width:100%;table-layout:fixed;font-size:11px}table.lnv td,table.lnv th{padding:2px 1px;word-break:break-all}table.lnv .big2{font-size:15px}.msw{background:#fff4e5;border:1px solid #f0c27b;border-radius:8px;padding:8px}.msw button{flex:1 1 140px}#st{white-space:pre-wrap;font-family:monospace;font-size:13px}
@media(max-width:480px){td,th{font-size:13px;padding:3px}}
</style></head><body><div class="wrap">
<h1>八字健康疾病參考</h1>
<div class="warn">本站內容為<b>命理參考，非醫療診斷</b>。身體不適請就醫。</div>
<div class="card">
<div class="row">性別：<select id="sex"><option>男</option><option>女</option></select></div>
<div class="row"><b>以公曆生辰自動排四柱（選填）</b></div>
<div class="row"><input type="date" id="bd" value=""><input type="time" id="bt" value="">
時區 UTC+<input type="number" id="tz" value="8" step="0.5" style="width:60px"></div>
<div class="row"><label><input type="checkbox" id="lz" checked> 夜子時（23–24時）日柱換次日</label>
<button class="sec" id="calc">排四柱</button></div>
<div class="note" id="cnote"></div>
<div class="row"><b>四柱（可直接選）</b></div>
<div class="pg" id="pg"></div>
<div class="row" style="margin-top:10px"><button id="go">分析</button></div>
</div>
<div id="out"></div>
<div class="row" id="exp" style="display:none"><button id="pdf">下載 PDF</button><button id="doc" class="sec">下載 Word</button><span class="note" id="emsg"></span></div>
<div id="st"></div>
</div>
<script src="health-data.js"></script><script src="health-core.js"></script><script src="tbx.js"></script><script src="app.js"></script>
</body></html>
